name: skill-day
services:
  frontend:
    build:
      context: ./frontend
      target: runtime
    ports:
      - "${FRONTEND_HOST:-127.0.0.1}:${FRONTEND_PORT:-8080}:8080"
    environment:
      API_GATEWAY_URL: ${API_GATEWAY_URL:-http://api-gateway:8080}
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ReverseProxy__Clusters__auth__Destinations__primary__Address: http://auth-service:8080/
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_BSP_SCHEDULE_DELAY: "500"
      OTEL_BLRP_SCHEDULE_DELAY: "500"
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
    depends_on:
      aspire-dashboard:
        condition: service_started
      auth-service:
        condition: service_healthy
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AuthDb: Host=auth-db;Database=skill_day_auth;Username=auth;GSS Encryption Mode=Disable
      Database__Password: ${AUTH_DB_PASSWORD:-local-development-only}
      Auth__PublicOrigin: ${PUBLIC_ORIGIN:-http://127.0.0.1:8080}
      Auth__AllowedOrigins__0: http://127.0.0.1:5173
      Auth__AutoMigrate: "true"
      Auth__RequireConfirmedEmail: ${AUTH_REQUIRE_CONFIRMED_EMAIL:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_BSP_SCHEDULE_DELAY: "500"
      OTEL_BLRP_SCHEDULE_DELAY: "500"
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
      BootstrapAdmin__Email: ${AUTH_ADMIN_EMAIL:-}
      BootstrapAdmin__Password: ${AUTH_ADMIN_PASSWORD:-}
      Smtp__Host: ${SMTP_HOST:-mailpit}
      Smtp__Port: ${SMTP_PORT:-1025}
      Smtp__Security: ${SMTP_SECURITY:-None}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__From: ${SMTP_FROM:-no-reply@skill-day.test}
      Smtp__Name: ${SMTP_NAME:-Навык дня}
    volumes:
      - auth-keys:/var/lib/skill-day-auth
    depends_on:
      aspire-dashboard:
        condition: service_started
      auth-db:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  aspire-dashboard:
    image: mcr.microsoft.com/aspire/dashboard:13.6.5
    ports:
      - "127.0.0.1:${ASPIRE_DASHBOARD_PORT:-18888}:18888"
    environment:
      ASPNETCORE_URLS: http://+:18888
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    restart: unless-stopped

  auth-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: skill_day_auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-local-development-only}
    volumes:
      - auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d skill_day_auth"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  auth-data:
  auth-keys:
